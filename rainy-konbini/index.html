<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { FXAAPass } from 'three/addons/postprocessing/FXAAPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ======================================================================
   Layout (1 unit ≈ 1 m). The base is a 24 × 24 square centred on the origin.
   Front road runs along +z edge, side road along +x edge; the store sits
   in the inner corner. Layers: 0 solid (outlined + reflected), 1 fx,
   2 glow sprites (reflected), 3 wet ground (outlined, samples reflection).
   ====================================================================== */
const TAU = Math.PI * 2;
const LOT = 0.14;            // sidewalk / lot surface height
const EDGE = 7.4;            // inner edge of both roads
const CR = 1.6;              // corner curb radius
const S = { x0: -5, x1: 4, z0: -5, z1: 1.2, floor: 0.163, win0: 0.5, win1: 2.8, can0: 2.86, can1: 3.0, roof: 3.9, top: 4.1 };
const LAMP = { x: 7.68, y: 5.55, z: 7.68 };
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

let seed = 7331;
const rand = () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const rr = (a, b) => a + (b - a) * rand();
const pick = (a) => a[Math.floor(rand() * a.length)];
const mpick = (a) => a[Math.floor(Math.random() * a.length)];
const C = (hex) => new THREE.Color(hex);

/* ---------- renderer / scene / camera ---------- */
const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.setClearColor(0x070a14, 1);
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.08;
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.5, 400);
camera.layers.enable(1); camera.layers.enable(2); camera.layers.enable(3);

{
  const c = document.createElement('canvas'); c.width = 8; c.height = 512;
  const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 512);
  gr.addColorStop(0, '#080c1c'); gr.addColorStop(0.42, '#16203c'); gr.addColorStop(0.7, '#101830'); gr.addColorStop(1, '#06080f');
  g.fillStyle = gr; g.fillRect(0, 0, 8, 512);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  scene.background = t;
}

/* ---------- shared uniforms ---------- */
const NPOOL = 10;
const U = {
  time: { value: 0 },
  rim: { value: new THREE.Color(0.2, 0.3, 0.55) },
  warm: { value: new THREE.Color(1.02, 0.93, 0.78) },
  intLight: { value: 1 },
  tRefl: { value: null },
  tWet: { value: null },
  reflMat: { value: new THREE.Matrix4() },
  pool: { value: Array.from({ length: NPOOL }, () => new THREE.Vector4(0, 0, 1, 0)) },
  poolCol: { value: Array.from({ length: NPOOL }, () => new THREE.Color(0, 0, 0)) },
  spill: { value: 1 },
  door: { value: 0 },
};

/* ---------- toon materials ---------- */
function makeRamp(vals) {
  const t = new THREE.DataTexture(new Uint8Array(vals.map((v) => Math.round(v * 255))), vals.length, 1, THREE.RedFormat);
  t.magFilter = t.minFilter = THREE.NearestFilter; t.generateMipmaps = false; t.needsUpdate = true;
  return t;
}
const RAMP = makeRamp([0, 0, 0, 0, 0.5, 1, 1, 1]);
const GLSL_WORLD = 'vec3 nWorld(vec3 n){ return normalize((vec4(n, 0.0) * viewMatrix).xyz); }';

// Exterior: toon ramp + cool rim from the night sky + faint wet sheen on top faces.
const EXT_FRAG = /* glsl */`
{
  vec3 nW = nWorld(normal);
  float ndv = clamp(dot(normal, normalize(vViewPosition)), 0.0, 1.0);
  float rim = smoothstep(0.64, 0.8, 1.0 - ndv) * (0.25 + 0.75 * smoothstep(-0.2, 0.9, nW.y));
  outgoingLight += uRim * rim * (0.3 + diffuseColor.rgb);
  outgoingLight += vec3(0.012, 0.018, 0.034) * smoothstep(0.75, 1.0, nW.y);
}`;
function extMat(o = {}) {
  const m = new THREE.MeshToonMaterial({ gradientMap: RAMP, vertexColors: true, ...o });
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uRim = U.rim;
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nuniform vec3 uRim;\n' + GLSL_WORLD)
      .replace('#include <opaque_fragment>', EXT_FRAG + '\n#include <opaque_fragment>');
  };
  return m;
}
// Interior: flat, warm, evenly lit anime interior (ignores the night lights).
const INT_FRAG = /* glsl */`
{
  vec3 nW = nWorld(normal);
  float d = dot(nW, normalize(vec3(0.3, 1.0, 0.55)));
  float band = d > 0.42 ? 1.0 : (d > -0.15 ? 0.82 : 0.68);
  outgoingLight = diffuseColor.rgb * uWarm * band * uIntLight + totalEmissiveRadiance;
}`;
function intMat(o = {}) {
  const m = new THREE.MeshToonMaterial({ gradientMap: RAMP, vertexColors: true, ...o });
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uWarm = U.warm; sh.uniforms.uIntLight = U.intLight;
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nuniform vec3 uWarm;\nuniform float uIntLight;\n' + GLSL_WORLD)
      .replace('#include <opaque_fragment>', INT_FRAG + '\n#include <opaque_fragment>');
  };
  return m;
}

// Wet ground: toon lit base + fake light pools + window spill + streaky planar reflection + rain ripples.
const GROUND_PARS = /* glsl */`
#define NPOOL ${NPOOL}
uniform sampler2D tRefl; uniform sampler2D tWet; uniform mat4 uReflMat;
uniform float uTime; uniform float uReflOn; uniform float uPoolOn; uniform float uSpill; uniform float uDoor;
uniform vec4 uPool[NPOOL]; uniform vec3 uPoolCol[NPOOL];
varying vec4 vRefl; varying vec3 vWP;
${GLSL_WORLD}
vec2 hh22(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * vec3(.1031, .1030, .0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }
vec3 ripple(vec2 p, float t){
  vec2 cell = floor(p), f = fract(p); vec3 acc = vec3(0.0);
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    vec2 o = vec2(float(i), float(j)); vec2 h = hh22(cell + o);
    float ph = fract(t * (0.55 + 0.6 * h.x) + h.y);
    vec2 d = f - o - h; float dist = length(d);
    float ring = smoothstep(0.06, 0.0, abs(dist - ph * 0.85)) * (1.0 - ph) * (1.0 - ph);
    acc += vec3(d / max(dist, 1e-3) * ring, ring);
  }
  return acc;
}
float mull(float x, float spread){
  float m = min(min(abs(x + 5.0), abs(x + 3.4)), min(abs(x + 1.8), abs(x + 0.2)));
  m = min(m, min(abs(x - 1.5), min(abs(x - 3.1), abs(x - 4.0))));
  return smoothstep(0.035 * spread, 0.11 * spread, m);
}
float spillAt(vec3 p){
  float s = 0.0;
  float zf = p.z - 1.2;
  if (zf > 0.0 && p.x > -5.8 && p.x < 5.3) {
    float sp = 1.0 + zf * 0.45;
    float fall = exp(-zf * 0.62) * smoothstep(-0.05, 0.2, zf);
    float side = smoothstep(-5.8, -4.6, p.x) * smoothstep(5.3, 4.1, p.x);
    float door = 1.0 + uDoor * 0.7 * smoothstep(1.3, 0.3, abs(p.x - 2.3));
    s += mull(p.x, sp) * fall * side * door;
    s += 0.3 * side * (1.0 - smoothstep(0.8, 1.15, zf));
  }
  float xf = p.x - 4.0;
  if (xf > 0.0 && p.z > -5.0 && p.z < 2.2) {
    float sp = 1.0 + xf * 0.45;
    float m = min(abs(p.z + 0.8), min(abs(p.z - 0.2), abs(p.z - 1.2)));
    float pat = smoothstep(0.035 * sp, 0.11 * sp, m);
    float fall = exp(-xf * 0.7) * smoothstep(-0.05, 0.2, xf);
    float win = smoothstep(-1.4, -0.6, p.z) * smoothstep(2.2, 1.3, p.z);
    s += pat * fall * win;
    s += 0.26 * (1.0 - smoothstep(0.8, 1.15, xf)) * smoothstep(-5.0, -4.5, p.z) * (1.0 - win);
  }
  return s;
}`;
const GROUND_FRAG = /* glsl */`
{
  vec3 nW = nWorld(normal);
  float up = smoothstep(0.6, 0.9, nW.y);
  vec4 wet = texture2D(tWet, vec2(vWP.x / 24.0 + 0.5, 0.5 - vWP.z / 24.0));
  float puddle = smoothstep(0.45, 0.6, wet.r) * up;
  float damp = wet.g * up;
  float paintM = smoothstep(0.3, 0.55, dot(diffuseColor.rgb, vec3(0.3333)));
  vec3 rp = ripple(vWP.xz * 2.3, uTime) + 0.7 * ripple(vWP.xz * 3.4 + 7.0, uTime * 1.21);
  vec3 alb = diffuseColor.rgb;
  outgoingLight *= mix(1.0, 0.62, damp * (1.0 - paintM * 0.5)) * mix(1.0, 0.72, puddle);
  vec3 pool = vec3(0.0);
  for (int i = 0; i < NPOOL; i++) {
    float f = clamp(1.0 - length(vWP.xz - uPool[i].xy) / uPool[i].z, 0.0, 1.0);
    pool += uPoolCol[i] * (uPool[i].w * f * f);
  }
  vec3 spill = vec3(1.0, 0.76, 0.46) * spillAt(vWP) * uSpill;
  vec3 lightAdd = (pool + spill) * uPoolOn * mix(0.45, 1.0, up);
  outgoingLight += lightAdd * (alb * 1.35 + 0.035 * damp + 0.12 * paintM);
  vec3 Vd = normalize(cameraPosition - vWP);
  float fres = 0.04 + 0.96 * pow(1.0 - clamp(Vd.y, 0.0, 1.0), 5.0);
  float amt = damp * mix(0.42, 1.0, puddle) * mix(0.5, 1.0, fres) + paintM * 0.12 * damp;
  if (uReflOn > 0.5) {
    vec2 ruv = vRefl.xy / vRefl.w + rp.xy * (0.004 + 0.012 * puddle);
    float spread = mix(0.03, 0.005, puddle);
    vec3 rc = vec3(0.0); float ws = 0.0;
    for (int k = -3; k <= 3; k++) {
      float o = float(k) / 3.0; float w = exp(-o * o * 2.2);
      rc += texture2D(tRefl, ruv + vec2(0.0, o * spread)).rgb * w; ws += w;
    }
    outgoingLight += rc / ws * amt;
  } else {
    outgoingLight += vec3(0.03, 0.05, 0.09) * amt;
  }
  outgoingLight += vec3(0.30, 0.38, 0.55) * rp.z * puddle * 0.22;
}`;
function groundMat(map, reflOn, poolOn) {
  const m = new THREE.MeshToonMaterial({ gradientMap: RAMP, vertexColors: true, map });
  const own = { uReflOn: { value: reflOn }, uPoolOn: { value: poolOn } };
  m.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, own, { tRefl: U.tRefl, tWet: U.tWet, uReflMat: U.reflMat, uTime: U.time, uPool: U.pool, uPoolCol: U.poolCol, uSpill: U.spill, uDoor: U.door });
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nuniform mat4 uReflMat;\nvarying vec4 vRefl;\nvarying vec3 vWP;')
      .replace('#include <project_vertex>', '#include <project_vertex>\n{ vec4 wp = modelMatrix * vec4(transformed, 1.0); vWP = wp.xyz; vRefl = uReflMat * wp; }');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\n' + GROUND_PARS)
      .replace('#include <opaque_fragment>', GROUND_FRAG + '\n#include <opaque_fragment>');
  };
  return m;
}

// Window glass: faint tint, anime shine bands, droplets and sliding rain streaks.
function glassMat(rain) {
  return new THREE.ShaderMaterial({
    uniforms: { uTime: U.time, uRain: { value: rain ? 1 : 0 } },
    vertexShader: /* glsl */`
      varying vec3 vW; varying vec3 vN;
      void main(){ vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; vN = normalize(mat3(modelMatrix) * normal); gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: /* glsl */`
      uniform float uTime; uniform float uRain;
      varying vec3 vW; varying vec3 vN;
      vec3 h32(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * vec3(.1031, .1030, .0973)); p3 += dot(p3, p3.yxz + 33.33); return fract((p3.xxy + p3.yzz) * p3.zyx); }
      vec3 h31(float p){ vec3 p3 = fract(vec3(p) * vec3(.1031, .1030, .0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xxy + p3.yzz) * p3.zyx); }
      void main(){
        vec3 N = normalize(vN);
        vec2 p = abs(N.z) > 0.5 ? vec2(vW.x * sign(N.z), vW.y) : vec2(-vW.z * sign(N.x), vW.y);
        vec3 V = normalize(cameraPosition - vW);
        float fres = pow(1.0 - abs(dot(V, N)), 3.0);
        float diag = p.x * 0.75 + p.y;
        float b1 = 1.0 - smoothstep(0.0, 0.02, abs(fract(diag * 0.21 + 0.1) - 0.5) - 0.07);
        float b2 = 1.0 - smoothstep(0.0, 0.01, abs(fract(diag * 0.21 + 0.19) - 0.5) - 0.012);
        float shine = b1 * 0.07 + b2 * 0.14;
        vec3 col = vec3(0.5, 0.68, 0.85) * (0.18 + fres * 0.9) + vec3(shine * 1.3);
        float a = 0.06 + fres * 0.32 + shine;
        if (uRain > 0.5) {
          vec2 g = p * vec2(15.0, 12.0);
          vec2 id = floor(g); vec2 f = fract(g) - 0.5;
          vec3 n = h32(id + 11.0);
          float life = fract(uTime * 0.04 + n.z);
          float r = (0.1 + 0.16 * n.y) * smoothstep(0.0, 0.08, life) * smoothstep(1.0, 0.85, life);
          vec2 c = (n.xy - 0.5) * 0.5;
          float dd = length((f - c) * vec2(1.0, 1.15));
          float has = step(0.4, n.x);
          float drop = has * smoothstep(r, r * 0.55, dd);
          float spec = has * smoothstep(r * 0.42, 0.0, length(f - c - vec2(-0.28, 0.3) * r));
          float colW = 0.17;
          float cx = floor(p.x / colW);
          vec3 cn = h31(cx * 7.13 + 3.0);
          float lx = (fract(p.x / colW) - 0.5) * colW;
          float k = uTime * (0.35 + cn.y * 0.5) + cn.x * 10.0;
          float stp = floor(k) + smoothstep(0.55, 1.0, fract(k));
          float yh = 3.1 - mod(stp * 0.26 + cn.z * 3.0, 3.4);
          float wob = 0.012 * sin(p.y * 11.0 + cn.z * 6.0);
          float slide = step(0.45, cn.x);
          float head = slide * smoothstep(0.034, 0.02, length(vec2(lx - wob, (p.y - yh) * 0.8)));
          float trail = slide * smoothstep(0.011, 0.004, abs(lx - wob)) * step(yh, p.y) * smoothstep(yh + 0.9, yh, p.y);
          float hs = slide * smoothstep(0.012, 0.0, length(vec2(lx - wob + 0.01, p.y - yh - 0.012)));
          float body = max(drop, head);
          col = mix(col, vec3(0.06, 0.09, 0.14), body * 0.55);
          a = max(a, body * 0.5);
          col += vec3(1.0) * (spec + hs) * 1.1; a = max(a, max(spec, hs) * 0.85);
          col += vec3(0.25, 0.3, 0.38) * trail; a = max(a, trail * 0.22);
        }
        gl_FragColor = vec4(col, a);
      }`,
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
  });
}

/* ---------- texture atlas (signs, posters, labels) ---------- */
const ATLAS = 2048;
const atlasCanvas = document.createElement('canvas');
atlasCanvas.width = atlasCanvas.height = ATLAS;
const atlasTex = new THREE.CanvasTexture(atlasCanvas);
atlasTex.colorSpace = THREE.SRGBColorSpace;
atlasTex.anisotropy = Math.min(8, MAX_ANISO);
const REG = {};
let packX = 0, packY = 0, packRow = 0;
function reg(name, w, h, draw) {
  const pad = 5;
  if (packX + w + pad * 2 > ATLAS) { packX = 0; packY += packRow; packRow = 0; }
  const x = packX + pad, y = packY + pad;
  packX += w + pad * 2; packRow = Math.max(packRow, h + pad * 2);
  REG[name] = { x, y, w, h, draw, u0: (x + 0.5) / ATLAS, u1: (x + w - 0.5) / ATLAS, v0: 1 - (y + h - 0.5) / ATLAS, v1: 1 - (y + 0.5) / ATLAS };
}

/* ---------- materials ---------- */
const MX = extMat();
const MXA = extMat({ map: atlasTex });
const MI = intMat();
const MIA = intMat({ map: atlasTex });
const MGL = new THREE.MeshBasicMaterial({ vertexColors: true });
const MGLA = new THREE.MeshBasicMaterial({ vertexColors: true, map: atlasTex });
const MS = new THREE.MeshBasicMaterial({ vertexColors: true });                 // fascia sign (flickers)
const MSA = new THREE.MeshBasicMaterial({ vertexColors: true, map: atlasTex });  // fascia logo
const MPS = new THREE.MeshBasicMaterial({ vertexColors: true, map: atlasTex });  // pole sign
const MSN = new THREE.MeshBasicMaterial({ vertexColors: true, map: atlasTex });  // snack bar neon
const MTV = new THREE.MeshBasicMaterial({ vertexColors: true, map: atlasTex });  // flickering TV window
const MTUBE = new THREE.MeshBasicMaterial({ vertexColors: true });              // one tired ceiling tube
const MGLASS = glassMat(true);
const MGLASSI = glassMat(false);
const groundCanvas = document.createElement('canvas');
groundCanvas.width = groundCanvas.height = 2048;
const groundTex = new THREE.CanvasTexture(groundCanvas);
groundTex.colorSpace = THREE.SRGBColorSpace;
groundTex.anisotropy = MAX_ANISO;
const wetCanvas = document.createElement('canvas');
wetCanvas.width = wetCanvas.height = 512;
const wetTex = new THREE.CanvasTexture(wetCanvas);
U.tWet.value = wetTex;
const MG = groundMat(groundTex, 1, 1);
const MR = groundMat(groundTex, 0, 0);

/* ---------- geometry kit: everything static is merged per material ---------- */
const XS = [new THREE.Matrix4()];
const _v = new THREE.Vector3(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _s = new THREE.Vector3(1, 1, 1);
function pushX(x = 0, y = 0, z = 0, ry = 0, rx = 0, rz = 0, s = 1) {
  const m = new THREE.Matrix4().compose(_v.set(x, y, z), _q.setFromEuler(_e.set(rx, ry, rz)), _s.set(s, s, s));
  XS.push(XS[XS.length - 1].clone().multiply(m));
}
const popX = () => { XS.pop(); };
let BATCH = new Map();
function emit(geo, mat, layer = 0) {
  geo.applyMatrix4(XS[XS.length - 1]);
  const k = mat.id + '|' + layer;
  let b = BATCH.get(k);
  if (!b) BATCH.set(k, (b = { mat, layer, geos: [] }));
  b.geos.push(geo);
  return geo;
}
const KEEP = ['position', 'normal', 'uv', 'color'];
function paint(geo, c) {
  if (geo.index) geo = geo.toNonIndexed();
  for (const k of Object.keys(geo.attributes)) if (!KEEP.includes(k)) geo.deleteAttribute(k);
  const n = geo.attributes.position.count;
  if (!geo.attributes.uv) geo.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(n * 2), 2));
  if (!geo.attributes.normal) geo.computeVertexNormals();
  const a = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { a[i * 3] = c.r; a[i * 3 + 1] = c.g; a[i * 3 + 2] = c.b; }
  geo.setAttribute('color', new THREE.BufferAttribute(a, 3));
  return geo;
}
function place(g, x, y, z, rx = 0, ry = 0, rz = 0) {
  g.applyMatrix4(new THREE.Matrix4().compose(_v.set(x, y, z), _q.setFromEuler(_e.set(rx, ry, rz)), _s.set(1, 1, 1)));
  return g;
}
const tint = (c, k = 1) => C(c).multiplyScalar(k);
// box: y is the bottom unless o.c
function box(w, h, d, c, x, y, z, o = {}) {
  const g = paint(new THREE.BoxGeometry(w, h, d), tint(c, o.k ?? 1));
  place(g, x, o.c ? y : y + h / 2, z, o.rx || 0, o.ry || 0, o.rz || 0);
  return emit(g, o.m || MX, o.l || 0);
}
function cyl(r, h, c, x, y, z, o = {}) {
  const g = paint(new THREE.CylinderGeometry(o.rt ?? r, r, h, o.seg || 16, 1, !!o.open), tint(c, o.k ?? 1));
  place(g, x, o.c ? y : y + h / 2, z, o.rx || 0, o.ry || 0, o.rz || 0);
  return emit(g, o.m || MX, o.l || 0);

function drawAtlas() {
  const g = atlasCanvas.getContext('2d');
  g.fillStyle = '#808080'; g.fillRect(0, 0, ATLAS, ATLAS);
  for (const r of Object.values(REG)) {
    g.save(); g.translate(r.x, r.y); g.beginPath(); g.rect(0, 0, r.w, r.h); g.clip();
    r.draw(g, r.w, r.h);
    g.restore();
    // bleed the border outward so mipmaps don't pick up neighbours
    const p = 4;
    g.drawImage(atlasCanvas, r.x, r.y, r.w, 1, r.x, r.y - p, r.w, p);
    g.drawImage(atlasCanvas, r.x, r.y + r.h - 1, r.w, 1, r.x, r.y + r.h, r.w, p);
    g.drawImage(atlasCanvas, r.x, r.y - p, 1, r.h + p * 2, r.x - p, r.y - p, p, r.h + p * 2);
    g.drawImage(atlasCanvas, r.x + r.w - 1, r.y - p, 1, r.h + p * 2, r.x + r.w, r.y - p, p, r.h + p * 2);
  }
  atlasTex.needsUpdate = true;
}

/* ---------- ground: one 2048² painting of roads, sidewalks, lot and roof ---------- */
function drawGround() {
  const g = groundCanvas.getContext('2d'), N = 2048, k = N / 24;
  const X = (x) => (x + 12) * k, Z = (z) => (z + 12) * k, L = (d) => d * k;
  const rect = (x0, z0, x1, z1, col) => { g.fillStyle = col; g.fillRect(X(x0), Z(z0), L(x1 - x0), L(z1 - z0)); };
  const crack = (x, z, n) => {
    g.strokeStyle = 'rgba(14,16,20,.55)'; g.lineWidth = 1.4; g.beginPath(); g.moveTo(X(x), Z(z));
    let a = Math.random() * TAU;
    for (let i = 0; i < n; i++) { a += (Math.random() - 0.5) * 1.2; x += Math.cos(a) * 0.18; z += Math.sin(a) * 0.18; g.lineTo(X(x), Z(z)); }
    g.stroke();
  };
  const grate = (x, z, w, d) => {
    g.fillStyle = '#23272e'; g.fillRect(X(x), Z(z), L(w), L(d));
    g.fillStyle = '#4a515c';
    if (w > d) for (let i = 1; i < 9; i++) g.fillRect(X(x) + L(w) * i / 9 - 1, Z(z) + 2, 2, L(d) - 4);
    else for (let i = 1; i < 9; i++) g.fillRect(X(x) + 2, Z(z) + L(d) * i / 9 - 1, L(w) - 4, 2);
  };
  const lotPath = () => {
    g.beginPath(); g.moveTo(X(-12), Z(-12)); g.lineTo(X(EDGE), Z(-12)); g.lineTo(X(EDGE), Z(EDGE - CR));
    g.arc(X(EDGE - CR), Z(EDGE - CR), L(CR), 0, Math.PI / 2); g.lineTo(X(-12), Z(EDGE)); g.closePath();
  };
  // asphalt
  rect(-12, -12, 12, 12, '#3a404c');
  dots(g, 0, 0, N, N, 90000, ['rgba(18,20,26,.55)', 'rgba(96,104,118,.35)', 'rgba(62,68,80,.6)'], 1, 3);
  for (let i = 0; i < 6; i++) { const x = rr(-11, 8), z = rr(8, 11); rect(x, z, x + rr(0.8, 2.2), Math.min(11.9, z + rr(0.5, 1.2)), 'rgba(24,27,33,.38)'); }
  for (let i = 0; i < 5; i++) { const x = rr(8, 11), z = rr(-11, 5); rect(x, z, Math.min(11.9, x + rr(0.5, 1.2)), z + rr(0.8, 2.2), 'rgba(24,27,33,.38)'); }
  for (let i = 0; i < 16; i++) crack(rr(-11.5, 11.5), rr(8, 11.8), 10 + (i % 8));
  for (let i = 0; i < 10; i++) crack(rr(8, 11.8), rr(-11.5, 7), 10 + (i % 8));
  // L-gutters along the curb
  g.fillStyle = '#6a707b';
  g.fillRect(X(-12), Z(EDGE), L(12 + EDGE - CR), L(0.34));
  g.fillRect(X(EDGE), Z(-12), L(0.34), L(12 + EDGE - CR));
  g.beginPath(); g.arc(X(EDGE - CR), Z(EDGE - CR), L(CR + 0.34), 0, Math.PI / 2); g.arc(X(EDGE - CR), Z(EDGE - CR), L(CR), Math.PI / 2, 0, true); g.closePath(); g.fill();
  g.fillStyle = 'rgba(30,34,40,.5)';
  for (let x = -12; x < 5.8; x += 1) g.fillRect(X(x), Z(EDGE), 2, L(0.34));
  for (let z = -12; z < 5.8; z += 1) g.fillRect(X(EDGE), Z(z), L(0.34), 2);
  for (const x of [-9.2, -4.4, 0.4, 4.9]) grate(x, EDGE + 0.02, 0.5, 0.3);
  for (const z of [-9.6, -4.6, 0.6]) grate(EDGE + 0.02, z, 0.3, 0.5);
  // paint: edge lines, crosswalks, stop line, 止まれ
  const paint = 'rgba(236,240,244,.93)';
  rect(-12, 7.95, EDGE - CR, 8.07, paint);
  rect(7.95, -12, 8.07, EDGE - CR, paint);
  g.strokeStyle = paint; g.lineWidth = L(0.12);
  g.beginPath(); g.arc(X(EDGE - CR), Z(EDGE - CR), L(CR + 0.61), 0, Math.PI / 2); g.stroke();
  rect(-12, 11.55, 12, 11.67, paint);
  rect(11.55, -12, 11.67, 7.3, paint);
  for (let i = 0; i < 5; i++) rect(1.6, 7.95 + i * 0.8, 4.0, 8.4 + i * 0.8, paint);

  const p = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i < p.count; i++) uv.setXY(i, p.getX(i) / 24 + 0.5, 0.5 - p.getZ(i) / 24);
}

  sh.moveTo(-12, 12); sh.lineTo(EDGE, 12); sh.lineTo(EDGE, -(EDGE - CR));

      float dn = max(max(length(n0 - nm(vUv - ox)), length(n0 - nm(vUv + ox))), max(length(n0 - nm(vUv - oy)), length(n0 - nm(vUv + oy))));
      float e = max(eD, smoothstep(0.55, 0.85, dn));
      vec3 ink = c.rgb * 0.14 + vec3(0.008, 0.01, 0.024);
      c.rgb = mix(c.rgb, ink, e * 0.9);
      float l = dot(c.rgb, vec3(0.2126, 0.7152, 0.0722));
      c.rgb += vec3(0.006, 0.009, 0.022) * (1.0 - smoothstep(0.0, 0.2, l));
      c.rgb = max(mix(vec3(l), c.rgb, 1.1), 0.0);
      vec2 q = vUv - 0.5;
      c.rgb *= 1.0 - dot(q, q) * 0.9;
      gl_FragColor = c;
    }`,
};
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType, samples: 4 }));
composer.addPass(new RenderPass(scene, camera));
const outlinePass = new ShaderPass(OUTLINE);
composer.addPass(outlinePass);
composer.addPass(new UnrealBloomPass(new THREE.Vector2(256, 256), 0.55, 0.55, 0.88));
composer.addPass(new OutputPass());
composer.addPass(new FXAAPass());

const normalMat = new THREE.MeshNormalMaterial({ side: THREE.DoubleSide });
let normalRT = null;
function makeNormalRT(w, h) {
  if (normalRT) { normalRT.depthTexture.dispose(); normalRT.dispose(); }
  normalRT = new THREE.WebGLRenderTarget(w, h, { depthTexture: new THREE.DepthTexture(w, h) });
  outlinePass.uniforms.tNormal.value = normalRT.texture;
  outlinePass.uniforms.tDepth.value = normalRT.depthTexture;
}
function renderNormals() {
  const bg = scene.background;
  scene.background = null; scene.overrideMaterial = normalMat;
  camera.layers.set(0); camera.layers.enable(3);
  renderer.setRenderTarget(normalRT);
  renderer.setClearColor(0x000000, 0);
  renderer.render(scene, camera);
  renderer.setClearColor(0x070a14, 1);
  camera.layers.enable(1); camera.layers.enable(2);
  scene.overrideMaterial = null; scene.background = bg;
  renderer.setRenderTarget(null);
}

let dpr = Math.min(window.devicePixelRatio || 1, 1.5);
function resize() {
  const w = Math.max(1, innerWidth), h = Math.max(1, innerHeight);
  renderer.setPixelRatio(dpr); renderer.setSize(w, h, false);
  composer.setPixelRatio(dpr); composer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  const W = Math.floor(w * dpr), Hh = Math.floor(h * dpr);
  makeNormalRT(W, Hh);
  reflRT.setSize(Math.max(2, Math.floor(W / 2)), Math.max(2, Math.floor(Hh / 2)));
  outlinePass.uniforms.uTexel.value.set(1 / W, 1 / Hh);
  outlinePass.uniforms.uThick.value = Math.max(1, dpr * 0.75);
}
let accT = 0, accN = 0;
function adapt(dt) {
  if (window.__noAdapt) return;
  accT += dt; accN++;
  if (accT < 2.5) return;
  const avg = accT / accN; accT = 0; accN = 0;
  if (avg > 1 / 36 && dpr > 0.75) { dpr = Math.max(0.75, dpr - 0.25); resize(); }
}

/* ======================================================================
   Boot + animation
   ====================================================================== */
buildBase(); buildGround(); buildStore(); buildDoor(); buildInterior();
buildStreet(); buildCat(); buildAlleyAndApartment(); buildBackyard(); buildRoof();
flush();
buildLights();
makeRain(innerWidth * innerHeight > 1.1e6 ? 7000 : 4500);
makeSplashes(700); makeDrips(); makeSteam(); makeLightCone();

const controls = new OrbitControls(camera, canvas);
{
  const target = new THREE.Vector3(0.6, 0.2, 1.0);
  const vf = THREE.MathUtils.degToRad(camera.fov) / 2, hf = Math.atan(Math.tan(vf) * camera.aspect);
  const d = Math.max(14.5 / Math.tan(vf), 18 / Math.tan(hf)), pol = 1.03, az = 0.66;
  camera.position.set(target.x + d * Math.sin(pol) * Math.sin(az), target.y + d * Math.cos(pol), target.z + d * Math.sin(pol) * Math.cos(az));
  controls.target.copy(target);
  controls.minDistance = 8; controls.maxDistance = Math.max(90, d * 1.6);
  controls.minPolarAngle = 0.08; controls.maxPolarAngle = 1.48;
}
controls.enableDamping = true; controls.dampingFactor = 0.07;
controls.rotateSpeed = 0.55; controls.zoomSpeed = 0.9; controls.panSpeed = 0.6;
controls.addEventListener('change', () => {
  const t = controls.target;
  t.x = THREE.MathUtils.clamp(t.x, -9, 9); t.z = THREE.MathUtils.clamp(t.z, -9, 9); t.y = THREE.MathUtils.clamp(t.y, -1, 6);
});
controls.update();
resize();
addEventListener('resize', resize);

function flick(t, off, every, depth = 0.65) {
  if (REDUCED) return 1;
  const h = (n) => { const s = Math.sin(n * 127.1 + off * 311.7) * 43758.5453; return s - Math.floor(s); };
  const k = Math.floor((t + off) / every), local = t + off - k * every;
  if (h(k) > 0.6 || local > 0.7) return 1;
  return h(k * 7.1 + Math.floor(local * 18)) > 0.45 ? 1 - depth * (0.6 + 0.4 * h(k + local)) : 1;
}
const door = { st: 0, t: 0, next: 4.5, o: 0 };
let clock = 0, last = performance.now();
function tick(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now; clock += dt;
  const t = clock;
  U.time.value = t;
  controls.update();
  // automatic door
  door.t += dt;
  if (door.st === 0 && door.t > door.next) { door.st = 1; door.t = 0; }
  else if (door.st === 1) { door.o = Math.min(1, door.t / 0.9); if (door.o >= 1) { door.st = 2; door.t = 0; } }
  else if (door.st === 2 && door.t > 2.6) { door.st = 3; door.t = 0; }
  else if (door.st === 3) { door.o = Math.max(0, 1 - door.t / 1.2); if (door.o <= 0) { door.st = 0; door.t = 0; door.next = 7 + Math.random() * 9; } }
  const e = door.o * door.o * (3 - 2 * door.o);
  doorParts.L.position.x = 1.9 - 0.78 * e; doorParts.R.position.x = 2.7 + 0.78 * e;
  U.door.value = e;
  if (door.st === 0) doorParts.led.color.setRGB(1.6, 0.25, 0.2); else doorParts.led.color.setRGB(0.2, 1.6, 0.45);
  // distant traffic signal
  const cyc = (t + 4) % 26, idx = cyc < 12 ? 0 : cyc < 15 ? 1 : 2;
  anim.signal.forEach((s, i) => s.m.color.copy(s.base).multiplyScalar(i === idx ? 2.4 : 0.06));
  const sc = anim.signal[idx].base;
  anim.sigLight.color.copy(sc);
  anim.sigGlow.material.color.copy(sc).multiplyScalar(0.9);
  U.poolCol.value[6].copy(sc);
  anim.rain.uniforms.uLC.value[5].set(sc.r * 0.8, sc.g * 0.8, sc.b * 0.8);
  // signs and tubes
  const fs = flick(t, 0.0, 11);
  MS.color.setScalar(fs); MSA.color.setScalar(fs);
  U.spill.value = 0.92 + 0.08 * fs;
  MPS.color.setScalar(flick(t, 3.7, 8.5));
  const ft = flick(t, 1.3, 6.3, 0.85);
  MTUBE.color.setScalar(ft);
  U.intLight.value = 1 - (1 - ft) * 0.05;
  const sn = REDUCED || t % 5.2 < 4.6 ? 1 : 0.15;
  MSN.color.setScalar(sn); U.pool.value[5].w = 0.35 * sn; anim.snackGlow.material.opacity = sn;
  const tv = 0.75 + 0.25 * Math.sin(t * 3.1) * Math.sin(t * 1.7 + 1.3);
  MTV.color.setRGB(tv * 0.85, tv * 0.9, tv);
  for (const f of fans) f.rotation.z += dt * f.userData.speed;
  anim.tail.rotation.set(0, Math.sin(t * 1.3) * 0.35, Math.sin(t * 0.9) * 0.15);

  camera.updateMatrixWorld();
  renderReflection();
  renderNormals();
  composer.render(dt);
  adapt(dt);
  requestAnimationFrame(tick);
}

await loadFonts();
drawAtlas(); drawGround(); drawWet();
canvas.classList.add('on');
last = performance.now();
requestAnimationFrame(tick);
